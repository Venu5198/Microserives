name: User Service CI/CD

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'services/user-service/**'
      - 'packages/common/**'
      - '.github/workflows/user-service-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/user-service/**'
      - 'packages/common/**'
      - '.github/workflows/user-service-ci.yml'

jobs:
  lint-test-security:
    name: Lint, Test & Security Scan
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/user-service/requirements.txt
          pip install -e packages/common
          pip install ruff bandit pytest pytest-asyncio httpx

      - name: Run Ruff Linting
        run: |
          ruff check services/user-service packages/common

      - name: Run Bandit Security Analysis
        run: |
          bandit -r services/user-service packages/common/ecommerce_common/security.py -ll -ii

      - name: Run User Service Unit Tests
        run: |
          pytest services/user-service/tests/test_user_service_unit.py -v

  docker-build:
    name: Build & Package Docker Image
    needs: lint-test-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build User Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/user-service/Dockerfile
          push: false
          tags: |
            ecommerce/user-service:latest
            ecommerce/user-service:v1.0.0
            ecommerce/user-service:${{ github.sha }}
