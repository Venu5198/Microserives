name: Shipping Service CI/CD

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'services/shipping-service/**'
      - 'packages/common/**'
      - 'contracts/**'
      - 'pyproject.toml'
      - '.github/workflows/shipping-service-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/shipping-service/**'
      - 'packages/common/**'
      - 'contracts/**'
      - 'pyproject.toml'
      - '.github/workflows/shipping-service-ci.yml'

jobs:
  lint-test-security:
    name: Lint, Test & Security Scan
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/shipping-service/requirements.txt
          pip install -e packages/common
          pip install ruff bandit pytest pytest-asyncio httpx

      - name: Run Ruff Linting
        run: |
          ruff check services/shipping-service packages/common contracts

      - name: Run Bandit Security Analysis
        run: |
          bandit -r services/shipping-service -ll -ii

      - name: Run Shipping Service Unit Tests
        env:
          PYTHONPATH: .
        run: |
          pytest services/shipping-service/tests/test_shipping_service_unit.py -v

  docker-build:
    name: Build & Package Docker Image
    needs: lint-test-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Shipping Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/shipping-service/Dockerfile
          push: false
          tags: |
            ecommerce/shipping-service:latest
            ecommerce/shipping-service:v1.0.0
            ecommerce/shipping-service:${{ github.sha }}

