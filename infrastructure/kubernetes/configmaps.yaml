apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce-prod
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.ecommerce-prod.svc.cluster.local:5672/"
  USER_SERVICE_URL: "http://user-service.ecommerce-prod.svc.cluster.local:8001"
  PRODUCT_SERVICE_URL: "http://product-service.ecommerce-prod.svc.cluster.local:8002"
  INVENTORY_SERVICE_URL: "http://inventory-service.ecommerce-prod.svc.cluster.local:8003"
  CART_SERVICE_URL: "http://cart-service.ecommerce-prod.svc.cluster.local:8004"
  ORDER_SERVICE_URL: "http://order-service.ecommerce-prod.svc.cluster.local:8005"
  PAYMENT_SERVICE_URL: "http://payment-service.ecommerce-prod.svc.cluster.local:8006"
  SHIPPING_SERVICE_URL: "http://shipping-service.ecommerce-prod.svc.cluster.local:8007"
  NOTIFICATION_SERVICE_URL: "http://notification-service.ecommerce-prod.svc.cluster.local:8008"
---
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce-prod
type: Opaque
stringData:
  JWT_SECRET_KEY: "prod-jwt-secret-key-super-secure-at-least-32-chars-long"
  MONGO_URI: "mongodb://mongo-user:securepassword@mongodb.ecommerce-prod.svc.cluster.local:27017"

