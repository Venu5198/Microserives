apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ecommerce
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway.ecommerce.svc.cluster.local:8000']

      - job_name: 'user-service'
        static_configs:
          - targets: ['user-service.ecommerce.svc.cluster.local:8001']

      - job_name: 'product-service'
        static_configs:
          - targets: ['product-service.ecommerce.svc.cluster.local:8002']

      - job_name: 'inventory-service'
        static_configs:
          - targets: ['inventory-service.ecommerce.svc.cluster.local:8003']

      - job_name: 'cart-service'
        static_configs:
          - targets: ['cart-service.ecommerce.svc.cluster.local:8004']

      - job_name: 'order-service'
        static_configs:
          - targets: ['order-service.ecommerce.svc.cluster.local:8005']

      - job_name: 'payment-service'
        static_configs:
          - targets: ['payment-service.ecommerce.svc.cluster.local:8006']

      - job_name: 'shipping-service'
        static_configs:
          - targets: ['shipping-service.ecommerce.svc.cluster.local:8007']

      - job_name: 'notification-service'
        static_configs:
          - targets: ['notification-service.ecommerce.svc.cluster.local:8008']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ecommerce
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
              name: prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ecommerce
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: prometheus
  selector:
    app: prometheus

