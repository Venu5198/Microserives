apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-common-config
  namespace: ecommerce
data:
  ENVIRONMENT: "local-k8s"
  LOG_LEVEL: "INFO"
  MONGO_URI: "mongodb://mongodb.ecommerce.svc.cluster.local:27017"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.ecommerce.svc.cluster.local:5672/"
  REDIS_URL: "redis://redis.ecommerce.svc.cluster.local:6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: ecommerce
data:
  GATEWAY_PORT: "8000"
  USER_SERVICE_URL: "http://user-service.ecommerce.svc.cluster.local:8001"
  PRODUCT_SERVICE_URL: "http://product-service.ecommerce.svc.cluster.local:8002"
  INVENTORY_SERVICE_URL: "http://inventory-service.ecommerce.svc.cluster.local:8003"
  CART_SERVICE_URL: "http://cart-service.ecommerce.svc.cluster.local:8004"
  ORDER_SERVICE_URL: "http://order-service.ecommerce.svc.cluster.local:8005"
  PAYMENT_SERVICE_URL: "http://payment-service.ecommerce.svc.cluster.local:8006"
  SHIPPING_SERVICE_URL: "http://shipping-service.ecommerce.svc.cluster.local:8007"
  NOTIFICATION_SERVICE_URL: "http://notification-service.ecommerce.svc.cluster.local:8008"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-services-config
  namespace: ecommerce
data:
  USER_SERVICE_PORT: "8001"
  USER_DB_NAME: "user_db"
  PRODUCT_SERVICE_PORT: "8002"
  PRODUCT_DB_NAME: "product_db"
  INVENTORY_SERVICE_PORT: "8003"
  INVENTORY_DB_NAME: "inventory_db"
  CART_SERVICE_PORT: "8004"
  CART_DB_NAME: "cart_db"
  ORDER_SERVICE_PORT: "8005"
  ORDER_DB_NAME: "order_db"
  PAYMENT_SERVICE_PORT: "8006"
  PAYMENT_DB_NAME: "payment_db"
  SHIPPING_SERVICE_PORT: "8007"
  SHIPPING_DB_NAME: "shipping_db"
  NOTIFICATION_SERVICE_PORT: "8008"
  NOTIFICATION_DB_NAME: "notification_db"
